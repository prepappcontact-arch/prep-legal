<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Soleon Studio</title>
<meta name="description" content="Soleon Studio — solo-built apps. First release: PREP, a meal prep app for batch cooking and portioning.">
<style>
  :root {
    --sun: #F5A623;
    --lion: #C0392B;
    --bg: #0B0D12;
    --card: #14171F;
    --text: #EDEEF2;
    --muted: #9AA0AC;
    --blue: #4F7CFF;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    line-height: 1.5;
  }
  .wrap {
    max-width: 880px;
    margin: 0 auto;
    padding: 0 24px;
  }
  header.hero {
    padding: 80px 0 60px;
    text-align: center;
  }
  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 24px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--sun), var(--lion));
  }
  h1 {
    font-size: 2.2rem;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  .tagline {
    color: var(--muted);
    font-size: 1.05rem;
    max-width: 480px;
    margin: 0 auto;
  }
  section {
    padding: 56px 0;
    border-top: 1px solid #1F2330;
  }
  .app-card {
    background: var(--card);
    border-radius: 20px;
    padding: 40px;
  }
  .app-header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 8px;
  }
  .app-icon {
    width: 48px;
    height: 48px;
    border-radius: 12px;
    background: linear-gradient(135deg, #2b3350, #1a1f30);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: 800;
    font-size: 1.1rem;
  }
  .app-icon span:first-child { color: #fff; }
  .app-icon span:last-child { color: var(--blue); }
